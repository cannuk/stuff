<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A2E">
<title>Monterey for Two</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first field guide. A Lone Cypress hero that scrolls away under a sticky tab/day bar; one column of stop cards over a bay-fog glow. */
:root{
  --bg:#E8EFEE;          /* coastal fog */
  --surface:#FFFFFF;
  --ink:#0F2A2E;         /* deep bay */
  --dim:#5A7073;
  --line:#CFDCDB;
  --accent:#1D6B66;      /* bay teal */
  --accent-soft:#D5E8E5;
  --cypress:#2F5340;     /* Monterey cypress */
  --warn:#B4492E;        /* abalone / timeshare alarm */
  --warn-soft:#F6E2DA;
  --gold:#A87C17;        /* suggested pick */
  --glow:#CFE3E6;        /* fog bank behind the hero */
  --sun:#E39A5B;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1A1D;--surface:#11262A;--ink:#E1EDEB;--dim:#8EA6A6;--line:#223A3D;
  --accent:#6CC5BC;--accent-soft:#173A38;--cypress:#8FBF9E;--warn:#F08B6D;--warn-soft:#3A221B;--gold:#E2BC5C;--glow:#163B42;--sun:#E7A06A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1A1D;--surface:#11262A;--ink:#E1EDEB;--dim:#8EA6A6;--line:#223A3D;
  --accent:#6CC5BC;--accent-soft:#173A38;--cypress:#8FBF9E;--warn:#F08B6D;--warn-soft:#3A221B;--gold:#E2BC5C;--glow:#163B42;--sun:#E7A06A;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.5;color:var(--ink);
  background:radial-gradient(ellipse 140% 100vh at 50% -20vh,var(--glow),transparent 70%) no-repeat,var(--bg);background-attachment:fixed,scroll;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* Header: sticky with negative top = hero height, so the hero scrolls away and the bar stays. */
header{position:sticky;top:calc(env(safe-area-inset-top,0px) - var(--hero-h,0px));z-index:5;
  padding-top:env(safe-area-inset-top,0px)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 10px;opacity:var(--hero-o,1)}
.hero-text{min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,9vw,44px);line-height:1.02;margin:6px 0 4px;text-wrap:balance}
.status{font-size:14px;color:var(--dim);min-height:1.5em}
.status b{color:var(--accent);font-weight:600}
.cypress-art{flex:0 0 auto;width:104px;height:84px;color:var(--cypress)}
.cypress-art .sun{fill:var(--sun);opacity:.8}
.cypress-art .wave{stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round}
.bar{background:var(--bg);padding-block:8px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line);
  box-shadow:0 6px 12px -10px rgba(0,0,0,calc(var(--stuck,0)*.35))}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days{display:flex;gap:6px;margin-top:8px}
.day{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:5px 4px;cursor:pointer;text-align:center;font-family:var(--body);position:relative}
.day .d{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.day .n{font-family:var(--display);font-size:21px;line-height:1.1}
.day .t{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;min-height:1.2em}
.day[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.today::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.day.past{opacity:.6}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#content{padding-top:18px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:12px}
.dayhead h2{font-family:var(--display);font-weight:400;font-size:27px;margin:0;text-wrap:balance}
.wx{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.wx b{color:var(--ink)}
.wx svg{width:18px;height:18px;color:var(--accent)}

.nowbar{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.nowbar .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:700}
.nowbar b{font-weight:700}

.list{display:flex;flex-direction:column;gap:10px}
.stop{display:grid;grid-template-columns:58px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stop.past{opacity:.55}
.stop.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stop.next{border-style:dashed;border-color:var(--accent)}
.time{font-family:var(--mono);font-size:13px;color:var(--accent);padding-top:2px;font-variant-numeric:tabular-nums}
.time small{display:block;font-size:10px;color:var(--dim)}
.body{min-width:0}
.title{font-weight:700;font-size:15.5px}
.place{color:var(--dim);font-size:13px}
.note{margin:6px 0 0;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.prop{background:transparent;border:1px dashed var(--line);color:var(--dim)}
.chip.todo{background:var(--warn-soft);color:var(--warn)}
.chip.luna{background:transparent;border:1px solid var(--cypress);color:var(--cypress)}
.chip.noluna{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.chip.live{background:var(--ink);color:var(--bg)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.act{font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--surface)}
.act:hover{border-color:var(--accent);color:var(--accent)}
.phone{font-family:var(--mono);font-size:12px;color:var(--dim);user-select:all}

.olab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-top:10px}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.opt{display:inline-flex;align-items:center;gap:5px;font:600 12.5px var(--body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pick{width:12px;height:14px;color:var(--gold);flex:0 0 auto}
.optd{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:13.5px}
.optd .meta{color:var(--dim);font-size:12.5px}

.stop.pitch{border-color:var(--warn);background:linear-gradient(var(--warn),var(--warn)) top/100% 3px no-repeat,var(--surface)}
.stop.pitch .time{color:var(--warn)}
.rules{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:6px}
.rules li span{font-family:var(--mono);color:var(--warn);font-size:12px;padding-top:2px}
.script{margin-top:10px;font-family:var(--display);font-size:19px;line-height:1.3;color:var(--warn)}

.fc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:440px){.fc{grid-template-columns:1fr}}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.fcard.today{border-color:var(--accent)}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fhead .dn{font-weight:700}
.fhead svg{width:34px;height:34px;color:var(--accent)}
.temps{font-family:var(--display);font-size:36px;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.temps span{font-size:20px;color:var(--dim)}
.cond{font-size:14px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;margin-top:10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.stats dt{color:var(--dim)}
.stats dd{margin:0;font-weight:600}
.stats div{display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--line);padding-top:4px}
.tip{font-size:13px;color:var(--dim);margin-top:10px}
.fnote{font-size:12.5px;color:var(--dim);margin-top:12px}

.grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:18px 0 8px}
.grp:first-child{margin-top:0}
.tlist{display:flex;flex-direction:column;gap:8px}
.todo-item{display:grid;grid-template-columns:24px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.todo-item input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.todo-item.done .title{text-decoration:line-through;color:var(--dim)}
.meals{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.meal{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);padding:6px 14px;border-radius:10px;cursor:pointer}
.meal[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.alt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.alt-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.alt-top .title{font-size:15.5px}
.alt-area{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.04em}
.alt .what{font-size:13px;color:var(--dim)}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.tag.os{border-color:var(--gold);color:var(--gold)}
.tag.ro{border-color:var(--warn);color:var(--warn)}
.alt-intro{font-size:13.5px;color:var(--dim);margin:0 0 12px}
footer{margin-top:28px;font-size:12.5px;color:var(--dim);display:flex;gap:10px;align-items:flex-start}
footer svg{flex:0 0 auto;width:18px;height:22px;color:var(--cypress)}
@media (prefers-reduced-motion:no-preference){.stop,.fcard,.todo-item{animation:rise .25s ease both}}
@keyframes rise{from{transform:translateY(4px)}to{transform:none}}
</style>
</head>

/* ---------- time ---------- */
function nowLA(){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {iso:p.year+'-'+p.month+'-'+p.day, m:(+p.hour%24)*60+(+p.minute)};
}
function mins(it){const [h,mm]=it.t.split(':').map(Number);let H=h%12;if(it.ap==='PM')H+=12;return H*60+(mm||0)}
function fmtDur(m){m=Math.max(0,Math.round(m));const h=Math.floor(m/60),r=m%60;return h?(h+'h'+(r?' '+r+'m':'')):r+'m'}
const fmtDay=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
const daysBetween=(a,b)=>Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5);
const TRIP0=DAYS[0].iso, TRIP1=DAYS[DAYS.length-1].iso;

let NOW=nowLA();
let sel=Math.max(0,DAYS.findIndex(d=>d.iso===NOW.iso));
let view='itin';

/* Which stop is happening now / next on a given day */
function liveState(day){
  if(day.iso!==NOW.iso) return {cur:-1,next:-1};
  let cur=-1,next=-1;
  day.items.forEach((it,i)=>{if(mins(it)<=NOW.m)cur=i;else if(next<0)next=i});
  return {cur,next};
}

function renderStatus(){
  const el=document.getElementById('status'), d=daysBetween(NOW.iso,TRIP0);
  if(d>1){el.innerHTML='<b>'+d+' days to go.</b> A romantic weekend, paid for in two hours of willpower.';return}
  if(d===1){el.innerHTML='<b>Tomorrow.</b> Wheels rolling at noon.';return}
  const i=DAYS.findIndex(x=>x.iso===NOW.iso);
  if(i>=0){
    const {next}=liveState(DAYS[i]);
    if(next>=0){const it=DAYS[i].items[next];el.innerHTML='<b>Day '+(i+1)+' of 4.</b> Up next: '+esc(it.title)+' in '+fmtDur(mins(it)-NOW.m)+'.'}
    else el.innerHTML='<b>Day '+(i+1)+' of 4.</b> '+(i===DAYS.length-1?'Safe drive home.':'That’s a wrap for today.');
    return;
  }
  el.innerHTML='<b>Back home.</b> Hope it was a good one.';
}

/* ---------- weather ---------- */
const WX={};               // iso -> live daily values
let wxState='loading';     // loading | live | fallback
function wxInfo(code){
  if(code==null) return ['Forecast','cloud'];
  if(code===0) return ['Clear','sun'];
  if(code<=2) return ['Partly cloudy','part'];
  if(code===3) return ['Overcast','cloud'];
  if(code===45||code===48) return ['Fog','fog'];
  if(code>=95) return ['Thunderstorms','storm'];
  if(code>=51) return [code<=57?'Drizzle':'Rain','rain'];
  return ['Cloudy','cloud'];
}

};
const icon=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[k]+'</svg>';
function dayWx(d){
  const w=WX[d.iso];
  if(w) return {hi:w.hi,lo:w.lo,rain:w.rain,label:wxInfo(w.code)[0],ic:wxInfo(w.code)[1],w};
  return {hi:d.wx.hi,lo:d.wx.lo,rain:d.wx.rain,label:d.wx.sky,ic:d.wx.ic||'part',w:null};
}
async function loadWeather(){
  const url='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+
   '&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,uv_index_max,sunrise,sunset'+
   '&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone='+encodeURIComponent(TZ)+
   '&start_date='+TRIP0+'&end_date='+TRIP1;
  try{
    const r=await fetch(url); if(!r.ok) throw new Error(r.status);
    const j=await r.json(), D=j.daily;
    D.time.forEach((t,i)=>{WX[t]={code:D.weather_code[i],hi:Math.round(D.temperature_2m_max[i]),lo:Math.round(D.temperature_2m_min[i]),
      feels:Math.round(D.apparent_temperature_max[i]),rain:D.precipitation_probability_max[i],precip:D.precipitation_sum[i],
      wind:Math.round(D.wind_speed_10m_max[i]),uv:D.uv_index_max[i],sunrise:D.sunrise[i],sunset:D.sunset[i]}});
    wxState='live';
  }catch(e){wxState='fallback'}
  renderItin();renderFc();
}

/* ---------- rendering ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function actions(o){
  let h='';
  if(o.addr) h+='<a class="act" href="'+map(o.addr)+'" target="_blank" rel="noopener">Map</a>';
  if(o.phone) h+='<a class="act" href="tel:+1'+o.phone.replace(/\D/g,'')+'">Call</a><span class="phone">'+o.phone+'</span>';
  if(o.site) h+='<a class="act" href="'+o.site+'" target="_blank" rel="noopener">↗ Site</a>';
  return h?'<div class="acts">'+h+'</div>':'';
}
const pickIcon='<svg class="pick" aria-label="Suggested"><use href="#cy"/></svg>';
const stLabel={booked:['Booked',''],plan:['Plan',''],prop:['Idea','prop'],todo:['Needs booking','todo']};

function renderDays(){
  document.getElementById('days').innerHTML=DAYS.map((d,i)=>{
    const w=dayWx(d), cls=(d.iso===NOW.iso?' today':'')+(d.iso<NOW.iso?' past':'');
    return '<button class="day'+cls+'" aria-selected="'+(i===sel)+'" data-i="'+i+'"><div class="d">'+d.d+'</div><div class="n">'+d.n+'</div><div class="t">'+w.hi+'°</div></button>'}).join('');
}
function optDetail(o){
  return '<div><b>'+esc(o.name)+'</b> <span class="meta">· '+esc(o.cuisine)+' · '+o.price+'</span></div><div>'+esc(o.vibe)+'</div>'+actions(o);
}
function pitchCard(it,cls){
  return '<div class="stop pitch'+cls+'"><div class="time">'+it.t+'<small>'+it.ap+'</small></div><div class="body">'+
   '<div class="title">'+esc(it.title)+'</div><div class="place">'+esc(it.place)+' · 2 hours, give or take</div>'+
   '<p class="note">This is what pays for the weekend. Sit through it, collect the reward, buy nothing. You both have to attend, or the stay gets charged at full retail.</p>'+
   '<ul class="rules">'+
   '<li><span>01</span>Agree in the car: no one signs anything today, no matter what.</li>'+
   '<li><span>02</span>Today-only pricing is a sales tactic. A good deal survives a night’s sleep.</li>'+
   '<li><span>03</span>When they bring out the manager, the answer is the same.</li>'+
   '<li><span>04</span>Walk out with the $100 Blackhawk gift card in hand.</li>'+
   '<li><span>05</span>Safety net: California gives timeshare buyers a short cancellation window. Plan not to need it.</li>'+
   '</ul><div class="script">“It’s beautiful. We never decide anything the same day.”</div>'+
   '<div class="chips"><span class="chip">Booked</span></div></div></div>';
}
function renderItin(){
  const d=DAYS[sel], w=dayWx(d), live=liveState(d);
  let h='<div class="dayhead"><h2>'+esc(d.name)+'</h2><div class="wx">'+icon(w.ic)+'<span>'+fmtDay(d.iso)+' · <b>'+w.hi+'°</b> / '+w.lo+'° · '+w.label+'</span></div></div>';
  if(live.next>=0||live.cur>=0){
    const n=d.items[live.next];
    h+=n?'<div class="nowbar"><div><div class="lbl">Up next · in '+fmtDur(mins(n)-NOW.m)+'</div><b>'+esc(n.title)+'</b> at '+n.t+' '+n.ap+'</div></div>'
        :'<div class="nowbar"><div><div class="lbl">Done for today</div><b>Nothing else on the schedule.</b> Enjoy it.</div></div>';
  }
  h+='<div class="list">';
  d.items.forEach((it,k)=>{
    let cls='', badge='';
    if(d.iso<NOW.iso || (d.iso===NOW.iso && live.cur>=0 && k<live.cur)) cls=' past';
    if(d.iso===NOW.iso && k===live.cur){cls=' now';badge='<span class="chip live">Now</span>'}
    if(d.iso===NOW.iso && k===live.next){cls=' next';badge='<span class="chip live">Up next</span>'}
    if(it.pitch){h+=pitchCard(it,cls);return}
    const s=stLabel[it.st]||stLabel.prop;
    h+='<div class="stop'+cls+'" id="s-'+k+'"><div class="time">'+it.t+'<small>'+it.ap+'</small></div><div class="body">'+
      '<div class="title">'+esc(it.title)+'</div><div class="place">'+esc(it.place)+'</div>'+
      (it.note?'<p class="note">'+esc(it.note)+'</p>':'');
    if(it.opts){
      const btn=(o,j)=>'<button class="opt" aria-pressed="'+(o.star?'true':'false')+'" data-k="'+k+'" data-j="'+j+'">'+(o.star?pickIcon:'')+esc(o.name)+'</button>';
      const withL=it.opts.map((o,j)=>o.stay?'':btn(o,j)).join(''), stayL=it.opts.map((o,j)=>o.stay?btn(o,j):'').join('');
      if(withL) h+='<div class="olab">Patio · dog-friendly</div><div class="opts">'+withL+'</div>';
      if(stayL) h+='<div class="olab">Inside · needs a sitter</div><div class="opts">'+stayL+'</div>';
      const o=it.opts.find(x=>x.star)||it.opts[0];
      h+='<div class="optd" id="od-'+k+'">'+optDetail(o)+'</div>';
    }
    h+='<div class="chips">'+badge+'<span class="chip '+s[1]+'">'+s[0]+'</span>'+(it.noluna?'<span class="chip noluna">No Luna</span>':'')+'</div>'+
      actions(it)+'</div></div>';
  });
  document.getElementById('v-itin').innerHTML=h+'</div>';
}

function renderFc(){
  let h='<div class="fc">'+DAYS.map(d=>{
    const w=dayWx(d), L=w.w;

    return '<div class="fcard'+(d.iso===NOW.iso?' today':'')+'"><div class="fhead"><div class="dn">'+fmtDay(d.iso)+'</div>'+icon(w.ic)+'</div>'+
      '<div class="temps">'+w.hi+'° <span>/ '+w.lo+'°</span></div><div class="cond">'+w.label+'</div>'+
      '<dl class="stats">'+stats.map(s=>'<div><dt>'+s[0]+'</dt><dd>'+s[1]+'</dd></div>').join('')+'</dl>'+
      '<div class="tip">'+TIPS[d.iso]+'</div></div>'}).join('')+'</div>';
  h+='<p class="fnote">'+(wxState==='live'?'Live forecast for Monterey from Open-Meteo, updated when the page loads.'
     :wxState==='loading'?'Loading the live forecast…'
     :'Showing the Oct 6 snapshot. The live forecast loads on the deployed page once the trip is within forecast range.')+'</p>';
  document.getElementById('v-fc').innerHTML=h;
}

let meal='dinner';
function renderAlt(){
  const L={breakfast:'Breakfast',lunch:'Lunch',dinner:'Dinner',cocktails:'Cocktails',dive:'Dive bars',beer:'Beer',snacks:'Snacks',desserts:'Desserts',fun:'Fun'};
  let h='<p class="alt-intro">Backups, swaps, and extra stops for when you’re in the mood for something else.</p><div class="meals">'+
    Object.keys(L).map(k=>'<button class="meal" aria-pressed="'+(k===meal)+'" data-meal="'+k+'">'+L[k]+' <span class="alt-area">'+ALTS[k].length+'</span></button>').join('')+'</div><div class="list">';
  h+=ALTS[meal].map(a=>'<div class="alt"><div class="alt-top"><div class="title">'+esc(a.name)+'</div><div class="alt-area">'+esc(a.area)+'</div></div>'+
    '<div class="what">'+esc(a.what)+'</div><p class="note">'+esc(a.why)+'</p>'+
    '<div class="chips">'+a.tags.map(t=>'<span class="tag'+(t==='Old-school'?' os':t==='Romantic'?' ro':'')+'">'+esc(t)+'</span>').join('')+'</div>'+actions(a)+'</div>').join('');
  document.getElementById('v-alt').innerHTML=h+'</div>';
}

let done={}; try{done=JSON.parse(localStorage.getItem('mty-todo')||'{}')}catch(e){}
function renderTodo(){
  let h='';
  TODO.forEach(g=>{
    h+='<div class="grp">'+g.g+'</div><div class="tlist">'+g.items.map(t=>
      '<label class="todo-item'+(done[t.id]?' done':'')+'" for="td-'+t.id+'"><input type="checkbox" id="td-'+t.id+'" data-id="'+t.id+'"'+(done[t.id]?' checked':'')+'><div class="body"><div class="title">'+esc(t.title)+'</div><div class="place">'+esc(t.note)+'</div>'+((t.site||t.phone)?actions(t):'')+'</div></label>').join('')+'</div>';
  });
  document.getElementById('v-todo').innerHTML=h;
}

/* ---------- header collapse ---------- */
const hero=document.getElementById('hero'), root=document.documentElement;
let heroH=0;
function measure(){heroH=hero.offsetHeight;root.style.setProperty('--hero-h',heroH+'px');applyCollapse()}
function applyCollapse(){
  const c=heroH?Math.min(1,window.scrollY/heroH):0;
  root.style.setProperty('--hero-o',(1-c).toFixed(3));
  root.style.setProperty('--stuck',c>=1?1:0);
}
function collapsed(){return heroH && window.scrollY>=heroH-1}

function showView(v){
  const wasCollapsed=collapsed();
  view=v;
  ['itin','fc','alt','todo'].forEach(x=>{document.getElementById('v-'+x).hidden=x!==v;document.querySelector('[data-view="'+x+'"]').setAttribute('aria-selected',x===v)});
  document.getElementById('days').hidden=v!=='itin';
  measure();
  window.scrollTo(0,wasCollapsed?heroH:0);
  applyCollapse();
}

document.addEventListener('click',e=>{
  const day=e.target.closest('.day');
  if(day){sel=+day.dataset.i;renderDays();renderItin();if(view!=='itin')showView('itin');else{window.scrollTo(0,collapsed()?heroH:0)}return}
  const ml=e.target.closest('.meal'); if(ml){meal=ml.dataset.meal;renderAlt();return}
  const tab=e.target.closest('.tab'); if(tab){showView(tab.dataset.view);return}
  const opt=e.target.closest('.opt');
  if(opt){
    const o=DAYS[sel].items[+opt.dataset.k].opts[+opt.dataset.j];
    opt.closest('.body').querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',b===opt?'true':'false'));
    document.getElementById('od-'+opt.dataset.k).innerHTML=optDetail(o);
  }
});
document.addEventListener('change',e=>{
  if(e.target.matches('.todo-item input')){
    done[e.target.dataset.id]=e.target.checked;
    e.target.closest('.todo-item').classList.toggle('done',e.target.checked);
    try{localStorage.setItem('mty-todo',JSON.stringify(done))}catch(err){}
  }
});
window.addEventListener('scroll',applyCollapse,{passive:true});
window.addEventListener('resize',measure);

/* Refresh time-aware bits every minute (and when the phone wakes the tab). */
function tick(){
  const prev=NOW.iso; NOW=nowLA();
  if(NOW.iso!==prev){const i=DAYS.findIndex(d=>d.iso===NOW.iso);if(i>=0)sel=i}
  renderStatus();renderDays();if(view==='itin')renderItin();
}
setInterval(tick,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

renderStatus();renderDays();renderItin();renderFc();renderAlt();renderTodo();measure();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);
loadWeather();
</script>
